[project]
name = "t"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "open-spiel",
    "jupyterlab",
    "numpy",
    "ipykernel",
    "matplotlib",
    "torch",
    "tensordict",
    # Build-time deps for open-spiel's setup.py (CMake/pybind11 extension).
    # Needed in this venv because open-spiel is built with no-build-isolation
    # below, so its build backend runs against /opt/venv directly.
    "setuptools>=45",
    "wheel",
    "ml-collections>=1.1.0",
    "scipy>=1.18.0",
    "attrs>=26.1.0",
    "networkx>=3.6.1",
    "dm-tree>=0.1.10",
    "lightning>=2.6.5",
    "hydra-core>=1.3.5",
    "tensorboard>=2.21.0",
]

[tool.uv.sources]
# Built from our open_spiel fork, cloned to /open_spiel and built at image
# build time (see Dockerfile). To pick up fork changes, rebuild the image.
open-spiel = { path = "/open_spiel" }

[tool.uv]
# Build in this venv instead of a throwaway isolated env, so CC/CXX/ccache
# (set in the Dockerfile) are used and the build lands in a stable
# /open_spiel/build tree that ccache can hit across rebuilds.
no-build-isolation-package = ["open-spiel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[dependency-groups]
dev = [
    "pybind11-stubgen>=2.5.5",
]
