[project]
name = "t"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "open-spiel",
    "jupyterlab",
    "numpy",
    "ipykernel",
    "matplotlib",
    "torch",
    "tensordict",
    # Build-time deps for open-spiel's setup.py (CMake/pybind11 extension).
    # Needed in this venv because open-spiel is built with no-build-isolation
    # below, so its build backend runs against /opt/venv directly.
    "setuptools>=45",
    "wheel",
]

[tool.uv.sources]
# Built from the sibling open_spiel fork checkout, bind-mounted at /open_spiel
# (see .devcontainer/devcontainer.json). After editing the fork, run
# `uv sync --reinstall-package open-spiel` to rebuild and reinstall it.
open-spiel = { path = "/open_spiel" }

[tool.uv]
# Build in this venv instead of a throwaway isolated env, so CC/CXX/ccache
# (set in the Dockerfile) are used and the build lands in a stable
# /open_spiel/build tree that ccache can hit across rebuilds.
no-build-isolation-package = ["open-spiel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"